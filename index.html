<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <title>SocialBook</title>
  </head>
  <body>
    <!-- page header -->
    <header>
      <!-- nav icons -->
      <nav class="navigation_icon">
        <img src="./images/logo.png" alt="socialBook logo" class="logo" />

        <div class="icons">
          <img src="./images/notification.png" alt="notification" />
          <img src="./images/inbox.png" alt="email" />
          <img src="./images/video.png" alt="" />
        </div>
      </nav>

      <!-- search and profile -->
      <div class="user">
        <div class="search-box">
          <img src="./images/search.png" alt="" />
          <input type="search" class="search" placeholder="Search" />
        </div>

        <img src="./images/profile-pic.png" alt="" />

        <div class="status"></div>
      </div>
    </header>

    <!-- Layout -->
    <main class="container">
      <!-- left side content of the page -->
      <div class="left-sidebar">
        <!-- sidebar links -->
        <div class="group top">
          <!-- list -->
          <ul>
            <li>
              <div class="group_links">
                <a href="#"><img src="./images/news.png" alt="" /></a>
                <a href="#">Latest News</a>
              </div>
            </li>
            <li>
              <div class="group_links">
                <a href="#"><img src="./images/friends.png" alt="" /></a>
                <a href="#">Friends</a>
              </div>
            </li>
            <li>
              <div class="group_links">
                <a href="#"><img src="./images/group.png" alt="" /></a>
                <a href="#">Group</a>
              </div>
            </li>
            <li>
              <div class="group_links">
                <a href="#"><img src="./images/marketplace.png" alt="" /></a>
                <a href="#">Marketplace</a>
              </div>
            </li>
            <li>
              <div class="group_links">
                <a href="#"><img src="./images/watch.png" alt="" /></a>
                <a href="#">Watch</a>
              </div>
            </li>
          </ul>
          <a href="#">See More</a>
        </div>

        <!-- shortcuts -->
        <div class="shortcuts">
          <h3>Your Shortcuts</h3>
          <div class="group shortcut_group">
            <ul>
              <li>
                <div class="group_links">
                  <a href="#"><img src="./images/shortcut-1.png" alt="" /></a>
                  <a href="#">Web Developers</a>
                </div>
              </li>
              <li>
                <div class="group_links">
                  <a href="#"><img src="./images/shortcut-2.png" alt="" /></a>
                  <a href="#">Website Design Course</a>
                </div>
              </li>
              <li>
                <div class="group_links">
                  <a href="#"><img src="./images/shortcut-3.png" alt="" /></a>
                  <a href="#">Full Stack Development</a>
                </div>
              </li>
              <li>
                <div class="group_links">
                  <a href="#"><img src="./images/shortcut-4.png" alt="" /></a>
                  <a href="#">Website Experts</a>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- main content of the page -->
      <div class="main-content"></div>

      <!-- right side content of the page -->
      <div class="right-sidebar">
        <!-- event -->
        <div class="activities">
          <h3>Events</h3>
          <a href="#">See All</a>
        </div>

        <div class="notification_list">
          <!-- Calendar notification 1 -->
          <div class="calendars">
            <div class="date">
              <span class="date_number">18</span>
              <span class="month_number">March</span>
            </div>
            
            <!-- tasks for notification -->
            <div class="notification_tasks">
              <h3>Social Media</h3>
              <p>
                <img src="./images/location.png" alt="" />
                <span>Silion Tech Park</span>
              </p>
              <a href="#">More Info</a>
            </div>
          </div>

          <!-- calendar notification 2 -->
          <div class="calendars">
            <div class="date">
              <span class="date_number">22</span>
              <span class="month_number">June</span>
            </div>
            <!-- tasks for notification -->
            <div class="notification_tasks">
              <h3>Social Media</h3>
              <p>
                <img src="./images/location.png" alt="" />
                <span>Silion Tech Park</span>
              </p>
              <a href="#">More Info</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="./js/main.js"></script>
  </body>
</html>
