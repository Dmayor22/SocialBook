<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="../css/profile.css" />
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body>
    <header>
      <!-- nav icons -->
      <nav class="navigation_icon">
        <img src="../images/logo.png" alt="socialBook logo" class="logo" />

        <div class="icons">
          <img src="../images/notification.png" alt="notification" />
          <img src="../images/inbox.png" alt="email" />
          <img src="../images/video.png" alt="" />
        </div>
      </nav>

      <!-- search and profile -->
      <div class="user">
        <div class="search-box">
          <img src="../images/search.png" alt="" />
          <input type="search" class="search" placeholder="Search" />
        </div>

        <div class="profile_click">
          <img src="../images/profile-pic.png" alt="" id="user_img" />
          <div class="status"></div>
        </div>
      </div>

      <div class="dropdown_menu">
        <!-- toggle btn -->
        <div id="dark_mode_toogle">
          <span></span>
        </div>

        <!-- user profile -->
        <div class="dropdown_user_profile">
          <img src="../images/profile-pic.png" alt="" />

          <div>
            <p>John Nicholson</p>
            <a href="#">See your Profile</a>
          </div>
        </div>

        <div class="margin"></div>

        <!-- feedback -->
        <div class="dropdown_user_profile">
          <img src="../images/feedback.png" alt="" />

          <div>
            <p>Give Feedback</p>
            <a href="#">Help us to improve the new design</a>
          </div>
        </div>
        <div class="margin"></div>

        <!-- Settings -->
        <div class="dropdown_user_profile_link">
          <div class="dropdown_details">
            <img src="../images/setting.png" alt="" />
            <a href="#">Settings & Privacy </a>
          </div>

          <a href="#"><img src="../images/arrow.png" alt="" /></a>
        </div>

        <!-- help -->
        <div class="dropdown_user_profile_link">
          <div class="dropdown_details">
            <img src="../images/help.png" alt="" />
            <a href="#">Help & Support </a>
          </div>

          <a href="#"><img src="../images/arrow.png" alt="" /></a>
        </div>

        <!-- display -->
        <div class="dropdown_user_profile_link">
          <div class="dropdown_details">
            <img src="../images/display.png" alt="" />
            <a href="#">Display & Accessibility </a>
          </div>

          <a href="#"><img src="../images/arrow.png" alt="" /></a>
        </div>

        <!-- Logout -->
        <div class="dropdown_user_profile_link">
          <div class="dropdown_details">
            <img src="../images/logout.png" alt="" />
            <a href="#">Logout</a>
          </div>

          <a href="#"><img src="../images/arrow.png" alt="" /></a>
        </div>
      </div>
    </header>

    <main class="profile_container">
      <img src="../images/cover.png" alt="" class="cover" />

      <!-- profile information -->
      <div class="profile_info">
        <div class="profile_info_leftside">
          <img src="../images/profile.png" alt="" />

          <!-- details -->
          <div class="profile_info_leftside_info">
            <h3>Jack Nicholson</h3>
            <p>120 friends <span></span> 20 mutuals</p>
            <img src="../images/member-1.png" alt="" />
            <img src="../images/member-2.png" alt="" />
            <img src="../images/member-3.png" alt="" />
            <img src="../images/member-4.png" alt="" />
          </div>
        </div>

        <!-- right-side -->
        <div class="profile_info_rightside">
          <div class="profile_info_righttside_details">
            <div class="profile_btns">
              <!-- add friend -->
              <button type="button" id="add_friends">
                <div class="btn_details">
                  <img src="../images/add-friends.png" alt="" />
                  <span>Friends</span>
                </div>
              </button>

              <!-- message -->
              <button type="button" id="msg">
                <div class="btn_details">
                  <img src="../images/message.png" alt="" />
                  <span>Message</span>
                </div>
              </button>
            </div>
            <button type="button">
              <img src="../images/more.png" alt="" />
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/profile.js"></script>
  </body>
</html>
